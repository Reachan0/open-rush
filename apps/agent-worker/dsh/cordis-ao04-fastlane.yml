# AO-04 fast-lane integration composition.
#
# This opt-in composition keeps the original cordis-ao04.yml unchanged.  The
# The isolated integration runner writes an equivalent resolved composition
# into its evidence directory when it uses temporary package builds.
#
# stdout is reserved for JSON-RPC.  Diagnostics belong on stderr.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    baseURL: !!js process.env.DEEPSEEK_BASE_URL ?? 'https://api.deepseek.com'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

# Reuse the normal OpenRush Loop MCP bundle so Web Search and Amap remain
# available in the AO-04 fast-lane composition. It must finish connecting
# before workflow_run reads the runtime tool schemas.
- id: openrush-loop-mcp
  name: ./openrush-loop-mcp.mjs

# The AO-04 tool must mount before workflow_run so its schema is available at
# plugin assembly time.  workflow_run receives the protected name explicitly;
# it does not infer a scenario allow-list from the model prompt.
- id: tool-ao04-read-status
  name: ../../../packages/dsh-tool-ao04/dist/index.js

- id: tool-workflow-run
  name: ../../../packages/dsh-tool-workflow-run/dist/index.js
  config:
    eligibleToolNames:
      - ao04_read_status
    hideEligibleFromOuter: true
# AIGC END
